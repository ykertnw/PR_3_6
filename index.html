<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pokemon Fight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="body">
    <div class="playground">
        <div class="pokemon player1">
            <span class="lvl">Lv. 1</span>

            <img class="sprite" id="img-player1" alt="">

            <div class="details">
                <h2 class="name" id="name-player1">???</h2>
                <div class="hp">
                    <div class="bar">
                        <div class="health" id="progressbar-player1" style="width: 100%;"></div>
                    </div>
                    <span class="text" id="health-player1">- / -</span>
                </div>
            </div>
        </div>

        <div class="control" style="flex-direction: column; gap: 12px;">
            <!-- кнопки створюються з JS -->
        </div>

        <div class="pokemon player2">
            <span class="lvl">Lv. 1</span>

            <img class="sprite" id="img-player2" alt="">

            <div class="details">
                <h2 class="name" id="name-player2">???</h2>
                <div class="hp">
                    <div class="bar">
                        <div class="health" id="progressbar-player2" style="width: 100%;"></div>
                    </div>
                    <span class="text" id="health-player2">- / -</span>
                </div>
            </div>
        </div>
    </div>

    <div id="logs" style="max-width: 800px; margin: 0 auto 30px; padding: 10px 20px; background: rgba(255, 255, 255, 0.8); border-radius: 10px;"></div>
</div>
<div class="catch_screen"></div>

<script type="module" src="main.js"></script>
</body>
</html>
